<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microbit Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Control micro:bit 🚀</h1>

    <button id="connectBtn">Conectar micro:bit</button>

    <div class="section">
      <h2>LED</h2>

      <button onclick="sendCommand('LED_ON')">
        LED ON
      </button>

      <button onclick="sendCommand('LED_OFF')">
        LED OFF
      </button>
    </div>

    <div class="section">
      <h2>Servo</h2>

      <button onclick="sendCommand('SERVO:0')">
        0°
      </button>

      <button onclick="sendCommand('SERVO:90')">
        90°
      </button>

      <button onclick="sendCommand('SERVO:180')">
        180°
      </button>
    </div>

    <p id="status">
      Desconectado
    </p>
  </div>

  <script src="app.js"></script>

</body>
</html>
